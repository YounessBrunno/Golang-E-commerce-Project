services:
  postgres:
    image: postgres:15.3-alpine
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce-db
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data'
volumes:
  postgres-data: