version: "2"
sql:
  - engine: "postgresql"
    queries: "internals/adapters/postgresql/sqlc/queries.sql"
    schema: "migrations/*.sql"
    gen:
      go:
        package: "postgresql"
        out: "internals/adapters/postgresql/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
